async function synthesizeAzureSpeech(text, voiceName, rate, pitch, apiKey, region) {
    const ratePercent = Math.round((rate - 1) * 100);
    const pitchPercent = Math.round((pitch - 1) * 100);
    const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    const ssml = `<speak version="1.0" xml:lang="ja-JP"><voice name="${voiceName}"><prosody rate="${ratePercent >= 0 ? "+" : ""}${ratePercent}%" pitch="${pitchPercent >= 0 ? "+" : ""}${pitchPercent}%">${escaped}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
        method: "POST",
        headers: {
            "Ocp-Apim-Subscription-Key": apiKey,
            "Content-Type": "application/ssml+xml",
            "X-Microsoft-OutputFormat": "audio-16khz-32kbitrate-mono-mp3",
        },
        body: ssml,
    });
    if (!res.ok) {
        const errText = await res.text().catch(() => "");
        throw new Error(`Azure TTSエラー (${res.status}): ${errText || res.statusText}`);
